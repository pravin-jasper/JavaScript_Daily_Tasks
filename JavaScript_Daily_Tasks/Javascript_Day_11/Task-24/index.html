<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Changer</title>
</head>
<body>

    <h1 id="heading"> Pratice of JS DOM Button Click   </h1>

    <button onclick ="showHello()">Hello</button>

    <button onclick="showWelcome()">Welcome</button>

    <button onclick="showMorning()">Good Morning</button>

    <button onclick="resetHeading()">Reset</button>

    <script>
        function showHello() {

    document.getElementById("heading").innerText = "Hello";

}

function showWelcome() {

    document.getElementById("heading").innerText =
        "Welcome to JavaScript";

}

function showMorning() {

    document.getElementById("heading").innerText =
        "Good Morning";

}

function resetHeading() {

    document.getElementById("heading").innerText =
        "Pratice of JS DOM Button Click";

}
    </script>

</body>
</html>
