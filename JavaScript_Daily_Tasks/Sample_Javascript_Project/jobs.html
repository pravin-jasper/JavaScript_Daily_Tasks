<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse jobs — Careerly</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css"></head><body data-page="jobs" class="bg-slate-50 text-slate-900"><div id="app-header"></div><main class="mx-auto max-w-7xl px-5 py-12"><div><p class="text-sm font-bold uppercase tracking-widest text-indigo-600">Job board</p><h1 class="mt-2 text-4xl font-extrabold">Explore opportunities</h1><p class="mt-3 text-slate-500">Filter by what matters and find a role that fits.</p></div><div class="mt-8 grid gap-6 lg:grid-cols-[260px_1fr]"><aside class="h-fit rounded-2xl border border-slate-200 bg-white p-5"><h2 class="font-bold text-lg">Filters</h2><label class="mt-5 block text-sm font-semibold">Search title / keyword<input id="filter-query" class="field mt-2" placeholder="e.g. frontend developer"></label><label class="mt-4 block text-sm font-semibold">Location<input id="filter-location" class="field mt-2" placeholder="Remote, India, London…"></label><label class="mt-4 block text-sm font-semibold">Job type<select id="filter-type" class="field mt-2"><option value="">All types</option><option>Full Time</option><option>Part Time</option><option>Contract</option><option>Internship</option><option>Freelance</option></select></label><label class="mt-4 block text-sm font-semibold">Sort by<select id="filter-sort" class="field mt-2"><option value="recent">Most recent</option><option value="title">Title A–Z</option><option value="company">Company A–Z</option></select></label><button id="clear-filters" class="mt-5 w-full rounded-xl border border-slate-200 px-4 py-3 font-semibold hover:bg-slate-50">Clear filters</button><p class="mt-4 text-xs leading-5 text-slate-400">Live results are loaded from a public jobs API. Demo jobs appear if the API is unavailable.</p></aside><section><div class="mb-4 flex items-center justify-between"><p id="results-count" class="text-sm text-slate-500">Loading jobs…</p><button id="refresh-jobs" class="text-sm font-semibold text-indigo-600">↻ Refresh</button></div><div id="jobs-list" class="space-y-4"><div class="skeleton"></div><div class="skeleton"></div></div></section></div></main><div id="app-footer"></div><script src="assets/js/app.js"></script></body></html>
