<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Products</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        #output {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );

            gap: 25px;

            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: left;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .content h2 {
            margin: 0 0 10px;
            color: #1e293b;
        }

        .price {
            color: #16a34a;
            font-size: 22px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>💰 Budget Store</h1>

        <p class="subtitle">
            Find products under ₹10,000
        </p>

        <button onclick="showBudgetProducts()">
            Show Budget Products
        </button>

        <div id="output"></div>

    </div>


    <script>
        let products = [

    {
        name: "Headphones",
        price: 2000,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
    },

    {
        name: "Smart Watch",
        price: 3500,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
    },

    {
        name: "Keyboard",
        price: 2500,
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3"
    },

    {
        name: "Mouse",
        price: 1200,
        image: "https://images.unsplash.com/photo-1527814050087-3793815479db"
    },

    {
        name: "Laptop",
        price: 55000,
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
    }

];


function showBudgetProducts() {

    let output =
        document.getElementById("output");


    let budgetProducts =
        products.filter(function(product) {

            return product.price <= 10000;

        });


    output.innerHTML = "";


    for (let i = 0; i < budgetProducts.length; i++) {

        output.innerHTML +=

            '<div class="card">' +

                '<img src="' +
                budgetProducts[i].image +
                '" alt="' +
                budgetProducts[i].name +
                '">' +

                '<div class="content">' +

                    '<h2>' +
                    budgetProducts[i].name +
                    '</h2>' +

                    '<p class="price">' +
                    '₹' +
                    budgetProducts[i].price +
                    '</p>' +

                    '<span class="badge">' +
                    'Budget Friendly' +
                    '</span>' +

                '</div>' +

            '</div>';
    }
}
    </script>

</body>

</html>
