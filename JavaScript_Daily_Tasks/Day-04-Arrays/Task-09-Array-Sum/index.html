<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Task 09 - Array Sum</title>

</head>


<body>

    <h1>Task 09 - Array Sum</h1>

    <script>
        const numbers = [10, 20, 30, 40, 50];

        let sum = 0;

        for (let i = 0; i < numbers.length; i++) {

            sum = sum + numbers[i];

        }

        document.write("Array:", numbers);

        document.write("<br>");

        document.write("Sum of Array:", sum);
        </script>

</body>

</html>
