<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 12 - Reverse Array</title>

</head>

<body>

    <h1>Reverse an Array</h1>

   

    <script >
    const numbers = [10, 20, 30, 40, 50];



        let reversedArray = [];




        for (let i = numbers.length - 1; i >= 0; i--) {

            reversedArray.push(numbers[i]);

        }


        document.write("Original Array:", numbers);
        document.write("<br>")
        document.write("Reversed Array:", reversedArray);</script>

</body>

</html>
