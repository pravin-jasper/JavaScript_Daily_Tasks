<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>
</head>

<body>
    <center><br><br>

    <h1>Student List</h1>

    <button onclick="displayStudents()">Show Students</button>

    <div id="output"></div>

    <script>
        let students = [

    {
        name: "Jasper",
        age: 22,
        mark: 85
    },

    {
        name: "Vidhya",
        age: 21,
        mark: 72
    },

    {
        name: "Durai",
        age: 23,
        mark: 91
    }

];


function displayStudents() {

    let output = document.getElementById("output");

    output.innerHTML = "";

    for (let i = 0; i < students.length; i++) {

        output.innerHTML +=
            "<div>" +
            "<h3>" + students[i].name + "</h3>" +
            "<p>Age: " + students[i].age + "</p>" +
            "<p>Mark: " + students[i].mark + "</p>" +
            "</div>";
    }
}
    </script>

</body>

</html>
